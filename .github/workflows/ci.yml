name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build reads the schema but never connects; a placeholder keeps Prisma
  # happy without a database at this stage.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rural_school_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rural_school_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-only-secret-that-is-long-enough-to-pass-validation

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rural_school_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check for schema drift
        # Compares the freshly migrated database against schema.prisma. Catches
        # a schema edited without a matching migration, which would otherwise
        # only surface at deploy time. Exit code 2 means "there is a difference".
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Seed and smoke-test the database
        run: npx prisma db seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ruraledu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
