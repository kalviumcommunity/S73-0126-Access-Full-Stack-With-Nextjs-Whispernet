[build]
  command = "npm install && npx prisma generate && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Functions configuration for API routes
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "prisma"]